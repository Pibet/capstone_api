default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: postgres
  password: postgres123
  host: 127.0.0.1
  port: 5432
  sslmode: disable
  gssencmode: disable

development:
  <<: *default
  database: capstone_api_development

test:
  <<: *default
  database: capstone_api_test
